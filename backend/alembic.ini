# Alembic CLI config: `alembic -c backend/alembic.ini upgrade head` (run from the repo root).
# The app applies migrations itself at startup; the database URL comes from the app settings
# (SD_DATABASE_URL) unless sqlalchemy.url is set here.
[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
