[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sovereigndesk-backend"
dynamic = ["version"]
description = "FastAPI backend for SovereignDesk: data adapters, simulator, command parser, REST and WebSocket API."
requires-python = ">=3.12"
dependencies = [
  "sovereign-engine",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "apscheduler>=3.11,<4",
  "httpx2>=2.14",
  "tenacity>=9.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
redis = ["redis>=5.2"]

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["app", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]
