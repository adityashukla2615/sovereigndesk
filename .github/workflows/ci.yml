name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (Python ${{ matrix.python }}, Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: "3.12", node: "22" }
          - { python: "3.14", node: "24" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            engine/pyproject.toml
            backend/pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup PY=python ARGS=--no-hooks
      - run: make check PY=python

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      # Offline: CI must not depend on upstream data sites; the stack boots from the seed.
      - run: SD_OFFLINE=true docker compose up --detach --wait --wait-timeout 300
      - name: Probe the stack through nginx
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/ | grep -q '<title>SovereignDesk</title>'
          # The seed snapshot was migrated into TimescaleDB and is served with SEED badges.
          curl -fsS http://localhost:8080/api/data/status | python3 -c '
          import json, sys
          seeded = json.load(sys.stdin)["quality_counts"].get("SEED", 0)
          print("SEED series:", seeded)
          sys.exit(seeded < 100)'
          curl -fsS http://localhost:8080/api/data/series/ust/par/10Y | python3 -c '
          import json, sys
          rows = len(json.load(sys.stdin)["values"])
          print("10Y rows:", rows)
          sys.exit(rows < 1000)'
          # WebSocket upgrade must survive the proxy: expect 101 Switching Protocols.
          # RFC 6455 wants a fresh random 16-byte nonce per handshake.
          nonce=$(head -c 16 /dev/urandom | base64)
          handshake=$(curl -si --max-time 3 http://localhost:8080/ws \
            -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' -H "Sec-WebSocket-Key: ${nonce}" || true)
          echo "$handshake" | head -1
          echo "$handshake" | head -1 | grep -q ' 101 '
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
