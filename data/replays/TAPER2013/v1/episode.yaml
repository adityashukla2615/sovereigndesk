id: TAPER2013
title: The 2013 taper tantrum
summary: The Fed signalled it would slow its bond buying; US yields jumped, foreign money left India,
  the rupee fell to a record low and RBI tightened rupee liquidity in an emergency.
model: taper
window:
  start: '2013-05-01'
  end: '2013-09-30'
drivers:
- us10y
- vix
targets:
- fpi
- inr
- reserves
annotations:
