  text: 'Bernanke: the Fed could slow its purchases in the next few meetings'
  source: https://www.federalreserve.gov/newsevents/testimony/bernanke20130522a.htm
- date: '2013-06-19'
  text: 'FOMC: Bernanke sets out tapering later in the year'
