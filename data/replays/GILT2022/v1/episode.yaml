id: GILT2022
title: The September 2022 gilt crisis
summary: After the mini-budget, long gilt yields rose faster than ever recorded; leveraged LDI funds had
  to sell gilts into a market that could not take them, until the Bank of England bought long gilts as
  a backstop. The closest real analogue to a forced foreign sale, and the episode that calibrates the
  fire-sale price impact λ.
